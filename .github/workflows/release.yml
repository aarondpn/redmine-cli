name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27"

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          syft-version: v1.50.0

      - name: Verify module path matches tag major version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          major="${tag#v}"
          major="${major%%.*}"
          module=$(awk '/^module /{print $2}' go.mod)
          base="${module%/v[0-9]*}"
          if [ "$major" -ge 2 ]; then
            expected="${base}/v${major}"
          else
            expected="${base}"
          fi
          if [ "$module" != "$expected" ]; then
            echo "::error::go.mod module path '$module' does not match tag '$tag' (expected '$expected')"
            echo "For v2+ tags, bump go.mod module to end with /vN and rewrite imports accordingly."
            exit 1
          fi

      # The MCP image Dockerfile only copies prebuilt binaries (no RUN steps),
      # so buildx can assemble the arm64 image without QEMU.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

      - name: Locate release checksums
        id: checksums
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find dist -maxdepth 1 -type f -name 'redmine-cli_*_checksums.txt' -print)
          if [ "${#files[@]}" -ne 1 ]; then
            echo "::error::expected exactly one release checksum file, found ${#files[@]}"
            exit 1
          fi
          echo "path=${files[0]}" >> "$GITHUB_OUTPUT"

      - name: Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ${{ steps.checksums.outputs.path }}

      - name: Locate MCP image digest
        id: image
        shell: bash
        run: |
          set -euo pipefail
          digest=$(jq -r '[.[] | select(.type == "Docker Image" and (.name | startswith("ghcr.io/aarondpn/redmine-mcp:"))) | .extra.Digest] | unique | .[]' dist/artifacts.json)
          if [ "$(printf '%s\n' "$digest" | grep -c '^sha256:')" -ne 1 ]; then
            echo "::error::expected exactly one MCP image digest, got: ${digest:-<none>}"
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Attest MCP image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/aarondpn/redmine-mcp
          subject-digest: ${{ steps.image.outputs.digest }}

  # Publishes server.json to the official MCP Registry so registry-aware hosts
  # can install the Docker image. Stable releases only: the registry entry
  # points at the exact version tag, which prereleases also push, but `latest`
  # in the registry should not move to a prerelease.
  mcp-registry:
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      MCP_PUBLISHER_VERSION: v1.8.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The registry pulls the image anonymously to verify its
      # io.modelcontextprotocol.server.name label. New GHCR packages start out
      # private and visibility can only be changed in the package settings,
      # so fail early with instructions instead of an opaque publish error.
      - name: Check MCP image is publicly pullable
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          token=$(curl -fsS "https://ghcr.io/token?scope=repository:aarondpn/redmine-mcp:pull" | jq -r '.token // empty' || true)
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${token}" \
            -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json" \
            "https://ghcr.io/v2/aarondpn/redmine-mcp/manifests/${version}")
          if [ "$status" != "200" ]; then
            echo "::error::ghcr.io/aarondpn/redmine-mcp:${version} is not publicly pullable (HTTP ${status}). Set the package visibility to Public at https://github.com/users/aarondpn/packages/container/redmine-mcp/settings, then re-run this job."
            exit 1
          fi

      - name: Set server.json version
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          jq --arg v "$version" \
            '.version = $v | .packages[0].identifier = "ghcr.io/aarondpn/redmine-mcp:\($v)"' \
            server.json > server.tmp
          mv server.tmp server.json
          cat server.json

      - name: Install mcp-publisher
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher

      - name: Publish to MCP Registry
        run: |
          set -euo pipefail
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
