name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26"

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          syft-version: v1.50.0

      - name: Verify module path matches tag major version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          major="${tag#v}"
          major="${major%%.*}"
          module=$(awk '/^module /{print $2}' go.mod)
          base="${module%/v[0-9]*}"
          if [ "$major" -ge 2 ]; then
            expected="${base}/v${major}"
          else
            expected="${base}"
          fi
          if [ "$module" != "$expected" ]; then
            echo "::error::go.mod module path '$module' does not match tag '$tag' (expected '$expected')"
            echo "For v2+ tags, bump go.mod module to end with /vN and rewrite imports accordingly."
            exit 1
          fi

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

      - name: Locate release checksums
        id: checksums
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find dist -maxdepth 1 -type f -name 'redmine-cli_*_checksums.txt' -print)
          if [ "${#files[@]}" -ne 1 ]; then
            echo "::error::expected exactly one release checksum file, found ${#files[@]}"
            exit 1
          fi
          echo "path=${files[0]}" >> "$GITHUB_OUTPUT"

      - name: Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ${{ steps.checksums.outputs.path }}
