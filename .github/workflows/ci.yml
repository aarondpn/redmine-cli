name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27.3"

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.15.0

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27.3"

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      # The e2e package is behind a build tag, so neither `go test ./...` nor
      # golangci-lint compiles it. Without this, a compile error there is only
      # caught by the E2E workflow, which needs live containers.
      - name: Vet e2e package
        run: go vet -tags=e2e ./e2e

      - name: Test e2e helpers
        run: go test -tags=e2e -run 'TestParseRedmineVersion|TestRedmineAtLeast' ./e2e

  # Windows is the only platform where `redmine update` must move the running
  # binary aside and where install.ps1 runs; the windows-only tests exercise
  # both against a running executable and a stubbed release.
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27.3"

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

  # Installs and self-updates against the real latest GitHub release instead
  # of stubs: the install scripts piped into a shell as the docs show them,
  # and a running binary built from this tree updating itself to that
  # release. Needs network access to GitHub and Sigstore.
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27.3"

      - name: install.sh installs the latest release
        if: runner.os != 'Windows'
        env:
          REDMINE_INSTALL_DIR: ${{ runner.temp }}/install-sh
        run: |
          out=$(bash < install.sh 2>&1)
          printf '%s\n' "$out"
          grep -qF 'Attestation verified.' <<<"$out" || { echo "install.sh did not verify the attestation"; exit 1; }
          latest=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          version=$("$REDMINE_INSTALL_DIR/redmine" --version)
          echo "$version"
          grep -qF "${latest#v}" <<<"$version" || { echo "expected version ${latest#v}"; exit 1; }

      - name: install.ps1 installs the latest release (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        env:
          REDMINE_INSTALL_DIR: ${{ runner.temp }}\install-ps51
          REDMINE_CLI_NO_MODIFY_PATH: "1"
        run: |
          $out = Get-Content -Raw install.ps1 | Invoke-Expression 6>&1 | Out-String
          $out
          if ($out -notmatch 'Attestation verified\.') { throw 'install.ps1 did not verify the attestation' }
          $latest = (gh release view --repo $env:GITHUB_REPOSITORY --json tagName --jq .tagName).TrimStart('v')
          $version = & "$env:REDMINE_INSTALL_DIR\redmine.exe" --version
          $version
          if ($version -notmatch [regex]::Escape($latest)) { throw "expected version $latest" }

      - name: install.ps1 installs the latest release (PowerShell 7)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          REDMINE_INSTALL_DIR: ${{ runner.temp }}\install-pwsh
          REDMINE_CLI_NO_MODIFY_PATH: "1"
        run: |
          $out = Get-Content -Raw install.ps1 | Invoke-Expression 6>&1 | Out-String
          $out
          if ($out -notmatch 'Attestation verified\.') { throw 'install.ps1 did not verify the attestation' }
          $latest = (gh release view --repo $env:GITHUB_REPOSITORY --json tagName --jq .tagName).TrimStart('v')
          $version = & "$env:REDMINE_INSTALL_DIR\redmine.exe" --version
          $version
          if ($version -notmatch [regex]::Escape($latest)) { throw "expected version $latest" }

      - name: redmine update replaces the running binary with the latest release
        if: runner.os != 'Windows'
        run: |
          dir="$RUNNER_TEMP/update"
          mkdir -p "$dir"
          exe="$dir/redmine"
          go build -ldflags "-X main.version=2.0.0" -o "$exe" ./cmd/redmine
          "$exe" update
          latest=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          version=$("$exe" --version)
          echo "$version"
          grep -qF "${latest#v}" <<<"$version" || { echo "expected version ${latest#v} after the update"; exit 1; }

      - name: redmine update replaces the running binary with the latest release
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'update'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $exe = Join-Path $dir 'redmine.exe'
          go build -ldflags "-X main.version=2.0.0" -o $exe ./cmd/redmine
          if ($LASTEXITCODE -ne 0) { throw 'go build failed' }
          & $exe update
          if ($LASTEXITCODE -ne 0) { throw "redmine update failed with exit code $LASTEXITCODE" }
          $latest = (gh release view --repo $env:GITHUB_REPOSITORY --json tagName --jq .tagName).TrimStart('v')
          $version = & $exe --version
          $version
          if ($version -notmatch [regex]::Escape($latest)) { throw "expected version $latest after the update" }
          if (-not (Test-Path "$exe.old")) { throw 'expected the previous binary at redmine.exe.old' }

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - name: Scan for known vulnerabilities
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-input: "1.26"
          go-package: ./...

  # Builds the release archives and the MCP Docker image without publishing,
  # so a broken .goreleaser.yaml or docker/Dockerfile fails here instead of on
  # the next tag.
  release-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # Snapshot builds are never published, so the build cache is safe here.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7 # zizmor: ignore[cache-poisoning]
        with:
          go-version: "1.27.3"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: GoReleaser snapshot
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          # Same exact version as release.yml.
          # renovate: datasource=github-releases depName=goreleaser/goreleaser
          version: "v2.19.0"
          args: release --snapshot --clean --skip=sbom,homebrew

      - name: Smoke-test MCP image
        run: |
          set -euo pipefail
          image=$(docker images --filter 'reference=ghcr.io/aarondpn/redmine-mcp:*-amd64' --format '{{.Repository}}:{{.Tag}}' | head -n1)
          test -n "$image"
          # MCP 2026-07-28 handshake: a single sessionless server/discover call.
          request='{"jsonrpc":"2.0","id":1,"method":"server/discover","params":{"_meta":{"io.modelcontextprotocol/protocolVersion":"2026-07-28","io.modelcontextprotocol/clientCapabilities":{},"io.modelcontextprotocol/clientInfo":{"name":"ci","version":"1"}}}}'
          response=$( (echo "$request"; sleep 2) | docker run -i --rm -e REDMINE_SERVER=https://redmine.invalid -e REDMINE_API_KEY=ci "$image")
          echo "$response"
          echo "$response" | jq -e '.result._meta["io.modelcontextprotocol/serverInfo"].name == "redmine-cli" and (.result.supportedVersions | index("2026-07-28"))'
