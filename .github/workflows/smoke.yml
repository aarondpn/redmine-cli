name: Smoke

# Installs and self-updates against the real latest GitHub release instead of
# stubs: the install scripts piped into a shell as the docs show them, and a
# running binary built from this tree updating itself to that release. It
# needs GitHub and Sigstore, and fails in the minutes between a release being
# published and attested, so it runs only for changes to the install and
# update code, daily, and on demand rather than on every pull request.

on:
  pull_request:
    branches: [main]
    paths:
      - install.sh
      - install.ps1
      - internal/cmd/update/**
      - cmd/redmine/**
      - .goreleaser.yaml
      - .github/workflows/smoke.yml
  push:
    branches: [main]
    paths:
      - install.sh
      - install.ps1
      - internal/cmd/update/**
      - cmd/redmine/**
      - .goreleaser.yaml
      - .github/workflows/smoke.yml
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27.3"

      - name: install.sh installs the latest release
        if: runner.os != 'Windows'
        env:
          REDMINE_INSTALL_DIR: ${{ runner.temp }}/install-sh
        run: |
          out=$(bash < install.sh 2>&1) || { printf '%s\n' "$out"; echo "install.sh failed"; exit 1; }
          printf '%s\n' "$out"
          grep -qF 'Attestation verified.' <<<"$out" || { echo "install.sh did not verify the attestation"; exit 1; }
          latest=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          version=$("$REDMINE_INSTALL_DIR/redmine" --version)
          echo "$version"
          grep -qF "${latest#v}" <<<"$version" || { echo "expected version ${latest#v}"; exit 1; }

      - name: install.ps1 installs the latest release (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        env:
          REDMINE_INSTALL_DIR: ${{ runner.temp }}\install-ps51
          REDMINE_CLI_NO_MODIFY_PATH: "1"
        run: |
          $out = Get-Content -Raw install.ps1 | Invoke-Expression 6>&1 | Out-String
          $out
          if ($out -notmatch 'Attestation verified\.') { throw 'install.ps1 did not verify the attestation' }
          $latest = (gh release view --repo $env:GITHUB_REPOSITORY --json tagName --jq .tagName).TrimStart('v')
          $version = & "$env:REDMINE_INSTALL_DIR\redmine.exe" --version
          $version
          if ($version -notmatch [regex]::Escape($latest)) { throw "expected version $latest" }

      - name: install.ps1 installs the latest release (PowerShell 7)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          REDMINE_INSTALL_DIR: ${{ runner.temp }}\install-pwsh
          REDMINE_CLI_NO_MODIFY_PATH: "1"
        run: |
          $out = Get-Content -Raw install.ps1 | Invoke-Expression 6>&1 | Out-String
          $out
          if ($out -notmatch 'Attestation verified\.') { throw 'install.ps1 did not verify the attestation' }
          $latest = (gh release view --repo $env:GITHUB_REPOSITORY --json tagName --jq .tagName).TrimStart('v')
          $version = & "$env:REDMINE_INSTALL_DIR\redmine.exe" --version
          $version
          if ($version -notmatch [regex]::Escape($latest)) { throw "expected version $latest" }

      - name: redmine update replaces the running binary with the latest release
        if: runner.os != 'Windows'
        run: |
          dir="$RUNNER_TEMP/update"
          mkdir -p "$dir"
          exe="$dir/redmine"
          go build -ldflags "-X main.version=2.0.0" -o "$exe" ./cmd/redmine
          "$exe" update
          latest=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          version=$("$exe" --version)
          echo "$version"
          grep -qF "${latest#v}" <<<"$version" || { echo "expected version ${latest#v} after the update"; exit 1; }

      - name: redmine update replaces the running binary with the latest release
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'update'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $exe = Join-Path $dir 'redmine.exe'
          go build -ldflags "-X main.version=2.0.0" -o $exe ./cmd/redmine
          if ($LASTEXITCODE -ne 0) { throw 'go build failed' }
          & $exe update
          if ($LASTEXITCODE -ne 0) { throw "redmine update failed with exit code $LASTEXITCODE" }
          $latest = (gh release view --repo $env:GITHUB_REPOSITORY --json tagName --jq .tagName).TrimStart('v')
          $version = & $exe --version
          $version
          if ($version -notmatch [regex]::Escape($latest)) { throw "expected version $latest after the update" }
          if (-not (Test-Path "$exe.old")) { throw 'expected the previous binary at redmine.exe.old' }
