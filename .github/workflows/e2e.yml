name: E2E

on:
  pull_request:
    branches: [main]
    paths:
      - 'e2e/**'
      - 'internal/**'
      - '!internal/**/*_test.go'
      - 'cmd/**'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - '.github/workflows/e2e.yml'
  push:
    branches: [main]
    paths:
      - 'e2e/**'
      - 'internal/**'
      - '!internal/**/*_test.go'
      - 'cmd/**'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:
    inputs:
      version:
        description: Redmine version(s) to test
        type: choice
        options:
          - default
          - '4.2'
          - '5.1'
          - '6.1'
          - '7.0'
          - all
        default: default

permissions:
  contents: read

jobs:
  prepare:
    name: Select versions
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.select.outputs.versions }}
    steps:
      - id: select
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          case "${INPUT_VERSION:-default}" in
            all)
              echo 'versions=["4.2","5.1","6.1","7.0"]' >> "$GITHUB_OUTPUT"
              ;;
            4.2|5.1|6.1|7.0)
              echo "versions=[\"${INPUT_VERSION}\"]" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo 'versions=["4.2","5.1","6.1","7.0"]' >> "$GITHUB_OUTPUT"
              ;;
          esac

  e2e:
    name: Redmine ${{ matrix.version }}
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.prepare.outputs.versions) }}
    # The Makefile picks E2E_VERSION up from the environment; passing it this
    # way keeps the matrix value out of the shell scripts.
    env:
      E2E_VERSION: ${{ matrix.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27.3"

      - name: Bring up Redmine ${{ matrix.version }}
        run: make e2e-up

      - name: Run e2e suite
        run: make e2e-test

      # The contract tests write the raw / CLI / MCP payloads of every failing
      # case here, which is what makes a diff finding debuggable from CI.
      - name: Upload contract payloads
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-contract-payloads-${{ matrix.version }}
          path: e2e/_artifacts/
          if-no-files-found: ignore

      - name: Dump container logs
        if: failure()
        run: make e2e-logs

      - name: Tear down
        if: always()
        run: make e2e-down
