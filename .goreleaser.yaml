version: 2

# Pinned explicitly: GoReleaser otherwise derives this from go.mod's last
# path segment, which is now "v2" after the SIV migration. A "v2" project
# name would rename release assets to v2-<os>-<arch>.tar.gz, breaking both
# install.sh and the self-update path (which expect "redmine-cli-...").
project_name: redmine-cli

before:
  hooks:
    - mkdir -p completions
    - sh -c "go run ./cmd/redmine completion bash > completions/redmine.bash"
    - sh -c "go run ./cmd/redmine completion zsh > completions/redmine.zsh"
    - sh -c "go run ./cmd/redmine completion fish > completions/redmine.fish"

builds:
  - binary: redmine
    main: ./cmd/redmine
    # Fully static binaries. Without this, the native linux/amd64 build on the
    # Ubuntu runner links against glibc, which breaks on musl distros and in
    # the distroless MCP image. Nothing in the dependency tree needs cgo.
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}-{{ .Os }}-{{ .Arch }}"
    files:
      - completions/*

# Publish an SPDX JSON software bill of materials for every release archive.
# GoReleaser invokes Syft for this step; the release workflow installs a pinned
# Syft version before running GoReleaser.
sboms:
  - artifacts: archive

# MCP server image: ghcr.io/aarondpn/redmine-mcp. Prereleases only get the
# exact version tag so `latest` and the major/minor tags stay on stable
# releases. The io.modelcontextprotocol.server.name label lets the MCP
# Registry verify that server.json and the image belong together.
dockers_v2:
  - id: redmine-mcp
    dockerfile: docker/Dockerfile
    images:
      - ghcr.io/aarondpn/redmine-mcp
    tags:
      - "{{ .Version }}"
      - "{{ if not .Prerelease }}{{ .Major }}.{{ .Minor }}{{ end }}"
      - "{{ if not .Prerelease }}{{ .Major }}{{ end }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      org.opencontainers.image.title: redmine-mcp
      org.opencontainers.image.description: MCP server for Redmine, from redmine-cli
      org.opencontainers.image.source: https://github.com/aarondpn/redmine-cli
      org.opencontainers.image.url: https://redmine-cli.dev/guides/ai-agents/
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.licenses: MIT
      io.modelcontextprotocol.server.name: io.github.aarondpn/redmine-mcp

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^Merge "

homebrew_casks:
  - name: redmine
    binaries:
      - redmine
    completions:
      bash: completions/redmine.bash
      zsh: completions/redmine.zsh
      fish: completions/redmine.fish
    # Homebrew 7.0.4 deprecated `postflight` in favour of `postflight_steps`.
    # The stanza is written through `custom_block`. GoReleaser 2.19+ can also
    # emit it via `hooks.post.install_steps` with `{{ .StagedPath }}`; moving
    # there would need a check of the rendered cask. The rendered cask is
    # passed through Go templating, so Homebrew's `{{staged_path}}` token has
    # to be escaped.
    custom_block: |
      postflight_steps do
        run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ "{{staged_path}}" }}/redmine"]
      end
    repository:
      owner: aarondpn
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/aarondpn/redmine-cli
    description: CLI tool for interacting with Redmine project management

# Windows package managers. Both are skipped while their token secret is
# unset, so a release never fails because the bucket repo, the winget-pkgs
# fork or the secret does not exist yet. `index .Env` returns "" for a missing
# variable, where `.Env.NAME` would be a template error; it is only needed in
# skip_upload. GoReleaser requires `token` to be the plain `{{ .Env.NAME }}`
# form and only templates it after the skip_upload check. Prereleases are never
# published, so rc tags stay out of the bucket and winget-pkgs.
scoops:
  - name: redmine
    repository:
      owner: aarondpn
      name: scoop-bucket
      token: "{{ .Env.SCOOP_BUCKET_GITHUB_TOKEN }}"
    skip_upload: '{{ if and (index .Env "SCOOP_BUCKET_GITHUB_TOKEN") (not .Prerelease) }}false{{ else }}true{{ end }}'
    homepage: https://github.com/aarondpn/redmine-cli
    description: CLI tool for interacting with Redmine project management
    license: MIT

# Manifests are pushed to the aarondpn/winget-pkgs fork and a pull request is
# opened against microsoft/winget-pkgs.
winget:
  - name: redmine-cli
    package_identifier: aarondpn.redmine-cli
    publisher: aarondpn
    publisher_url: https://github.com/aarondpn
    short_description: CLI tool for interacting with Redmine project management
    license: MIT
    license_url: https://github.com/aarondpn/redmine-cli/blob/main/LICENSE
    homepage: https://github.com/aarondpn/redmine-cli
    skip_upload: '{{ if and (index .Env "WINGET_GITHUB_TOKEN") (not .Prerelease) }}false{{ else }}true{{ end }}'
    repository:
      owner: aarondpn
      name: winget-pkgs
      branch: "redmine-cli-{{ .Version }}"
      token: "{{ .Env.WINGET_GITHUB_TOKEN }}"
      pull_request:
        enabled: true
        base:
          owner: microsoft
          name: winget-pkgs
          branch: master

release:
  github:
    owner: aarondpn
    name: redmine-cli
  # Tags with a pre-release suffix (v2.15.0-rc.1) become GitHub prereleases,
  # which /releases/latest, `redmine update` and install.sh never pick.
  prerelease: auto
