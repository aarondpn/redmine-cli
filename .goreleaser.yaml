version: 2

# Pinned explicitly: GoReleaser otherwise derives this from go.mod's last
# path segment, which is now "v2" after the SIV migration. A "v2" project
# name would rename release assets to v2-<os>-<arch>.tar.gz, breaking both
# install.sh and the self-update path (which expect "redmine-cli-...").
project_name: redmine-cli

before:
  hooks:
    - mkdir -p completions
    - sh -c "go run ./cmd/redmine completion bash > completions/redmine.bash"
    - sh -c "go run ./cmd/redmine completion zsh > completions/redmine.zsh"
    - sh -c "go run ./cmd/redmine completion fish > completions/redmine.fish"

builds:
  - binary: redmine
    main: ./cmd/redmine
    # Fully static binaries. Without this, the native linux/amd64 build on the
    # Ubuntu runner links against glibc, which breaks on musl distros and in
    # the distroless MCP image. Nothing in the dependency tree needs cgo.
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}-{{ .Os }}-{{ .Arch }}"
    files:
      - completions/*

# Publish an SPDX JSON software bill of materials for every release archive.
# GoReleaser invokes Syft for this step; the release workflow installs a pinned
# Syft version before running GoReleaser.
sboms:
  - artifacts: archive

# MCP server image: ghcr.io/aarondpn/redmine-mcp. Prereleases only get the
# exact version tag so `latest` and the major/minor tags stay on stable
# releases. The io.modelcontextprotocol.server.name label lets the MCP
# Registry verify that server.json and the image belong together.
dockers_v2:
  - id: redmine-mcp
    dockerfile: docker/Dockerfile
    images:
      - ghcr.io/aarondpn/redmine-mcp
    tags:
      - "{{ .Version }}"
      - "{{ if not .Prerelease }}{{ .Major }}.{{ .Minor }}{{ end }}"
      - "{{ if not .Prerelease }}{{ .Major }}{{ end }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      org.opencontainers.image.title: redmine-mcp
      org.opencontainers.image.description: MCP server for Redmine, from redmine-cli
      org.opencontainers.image.source: https://github.com/aarondpn/redmine-cli
      org.opencontainers.image.url: https://redmine-cli.dev/guides/ai-agents/
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.licenses: MIT
      io.modelcontextprotocol.server.name: io.github.aarondpn/redmine-mcp

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^Merge "

homebrew_casks:
  - name: redmine
    binaries:
      - redmine
    completions:
      bash: completions/redmine.bash
      zsh: completions/redmine.zsh
      fish: completions/redmine.fish
    # Homebrew 7.0.4 deprecated `postflight` in favour of `postflight_steps`.
    # GoReleaser < 2.19 can only emit the old stanza via `hooks`, so the new
    # stanza is written through `custom_block`. The rendered cask is passed
    # through Go templating, so Homebrew's `{{staged_path}}` token has to be
    # escaped. Once GoReleaser 2.19 is out this can move to
    # `hooks.post.install_steps` with `{{ .StagedPath }}`.
    custom_block: |
      postflight_steps do
        run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ "{{staged_path}}" }}/redmine"]
      end
    repository:
      owner: aarondpn
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/aarondpn/redmine-cli
    description: CLI tool for interacting with Redmine project management

release:
  github:
    owner: aarondpn
    name: redmine-cli
